services:
  postgres:
    image: postgres:16-alpine
    container_name: rpg_esi07_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rpg_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rpg_esi07_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rpg_network
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpg_esi07_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: RPG_ESI07
      JwtSettings__Audience: RPG_ESI07_Client
      JwtSettings__AccessTokenExpirationMinutes: 15
      JwtSettings__RefreshTokenExpirationDays: 7
      JwtSettings__ExpirationMinutes: 15
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:4173
      Cors__AllowedOrigins__2: http://localhost
    ports:
      - "5009:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rpg_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpg_esi07_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - rpg_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  rpg_network:
    driver: bridge