name: v2-ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend:
    name: Backend — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: game-engine
            solution: services/game-engine/Leds.GameEngine.slnx
          - name: catalog
            solution: services/catalog/Leds.Catalog.slnx
          - name: player
            solution: services/player/Leds.Player.slnx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.service.name }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.service.name }}-

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.service.solution }}

      - name: Build
        run: dotnet build ${{ matrix.service.solution }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ matrix.service.solution }} --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend — game-client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/game-client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/game-client

      - name: Build
        run: npm run build
        working-directory: apps/game-client

      - name: Test
        run: npm run test
        working-directory: apps/game-client
