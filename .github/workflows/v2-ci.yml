name: v2-ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - T-RPG

jobs:
  backend:
    name: Backend — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: game-engine
            solution: services/game-engine/Leds.GameEngine.slnx
            migrations_project: services/game-engine/src/Leds.GameEngine.Infrastructure
            startup_project: services/game-engine/src/Leds.GameEngine.Api
            db_context: GameEngineDbContext
          - name: catalog
            solution: services/catalog/Leds.Catalog.slnx
            migrations_project: services/catalog/src/Leds.Catalog.Infrastructure
            startup_project: services/catalog/src/Leds.Catalog.Api
            db_context: CatalogDbContext
          - name: player
            solution: services/player/Leds.Player.slnx
            migrations_project: services/player/src/Leds.Player.Infrastructure
            startup_project: services/player/src/Leds.Player.Api
            db_context: PlayerDbContext

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.service.name }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.service.name }}-

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.service.solution }}

      - name: Build
        run: dotnet build ${{ matrix.service.solution }} --configuration Release --no-restore

      - name: Check EF migration model
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project ${{ matrix.service.migrations_project }} \
            --startup-project ${{ matrix.service.startup_project }} \
            --context ${{ matrix.service.db_context }} \
            --configuration Release \
            --no-build

      - name: Test
        run: dotnet test ${{ matrix.service.solution }} --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend — game-client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/game-client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/game-client

      - name: Build
        run: npm run build
        working-directory: apps/game-client

      - name: Test
        run: npm run test
        working-directory: apps/game-client
