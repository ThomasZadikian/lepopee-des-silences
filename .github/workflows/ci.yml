name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - T-RPG
  push:
    branches:
      - develop
      - T-RPG

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game-engine:
    uses: ./.github/workflows/_dotnet-component.yml
    with:
      component: game-engine
      solution: services/game-engine/Leds.GameEngine.slnx
      assembly-filter: Leds.GameEngine.*

  player:
    uses: ./.github/workflows/_dotnet-component.yml
    with:
      component: player
      solution: services/player/Leds.Player.slnx
      assembly-filter: Leds.Player.*

  catalog:
    uses: ./.github/workflows/_dotnet-component.yml
    with:
      component: catalog
      solution: services/catalog/Leds.Catalog.slnx
      assembly-filter: Leds.Catalog.*

  shared-building-blocks:
    uses: ./.github/workflows/_dotnet-component.yml
    with:
      component: shared-building-blocks
      solution: packages/shared-building-blocks/Leds.SharedBuildingBlocks.slnx
      assembly-filter: Leds.SharedBuildingBlocks

  game-client:
    uses: ./.github/workflows/_frontend.yml

  migration-consistency:
    uses: ./.github/workflows/_migration-consistency.yml

  required:
    name: Required quality gate
    if: always()
    needs:
      - game-engine
      - player
      - catalog
      - shared-building-blocks
      - game-client
      - migration-consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Require every component to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra statuses <<< "$RESULTS"
          for status in "${statuses[@]}"; do
            if [[ "$status" != success ]]; then
              echo "A component did not pass: $RESULTS" >&2
              exit 1
            fi
          done
          echo "All component quality gates passed: $RESULTS"
