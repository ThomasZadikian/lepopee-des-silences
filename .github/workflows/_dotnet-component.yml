name: Reusable .NET component quality

on:
  workflow_call:
    inputs:
      component:
        description: Stable component identifier used for artifacts
        required: true
        type: string
      solution:
        description: Path to the component solution
        required: true
        type: string
      assembly-filter:
        description: ReportGenerator assembly include filter
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.component }} / tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify test hygiene
        run: ./scripts/ci/verify-test-hygiene.sh

      - name: Build, test and enforce 85% coverage
        run: >-
          ./scripts/ci/test-dotnet-component.sh
          '${{ inputs.component }}'
          '${{ inputs.solution }}'
          '${{ inputs.assembly-filter }}'

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-${{ inputs.component }}
          path: |
            artifacts/test-results/${{ inputs.component }}/**/*.trx
            artifacts/test-results/${{ inputs.component }}/**/coverage.cobertura.xml
            artifacts/test-results/${{ inputs.component }}/**/coverage.opencover.xml
            artifacts/coverage/${{ inputs.component }}/
          if-no-files-found: warn
          retention-days: 14
