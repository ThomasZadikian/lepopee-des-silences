name: Reusable frontend quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: game-client / tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/game-client
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/game-client/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify test hygiene
        working-directory: .
        run: ./scripts/ci/verify-test-hygiene.sh

      - name: Type-check
        run: npm run typecheck

      - name: Unit and component tests with 80% CI coverage gate
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload frontend quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-game-client
          path: |
            apps/game-client/test-results/
            apps/game-client/coverage/
            apps/game-client/dist/
          if-no-files-found: warn
          retention-days: 14
