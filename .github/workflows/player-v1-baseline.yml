name: Player V1 database baseline

on:
  push:
    branches:
      - feature/account-authentication
    paths:
      - .github/workflows/player-v1-baseline.yml

permissions:
  contents: write

jobs:
  rebaseline-player:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/account-authentication

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Remove pre-V1 Player migrations
        run: rm -rf services/player/src/Leds.Player.Infrastructure/Persistence/Migrations

      - name: Build Player without migration history
        run: dotnet build services/player/Leds.Player.slnx --configuration Release

      - name: Generate InitialV1_0_0 baseline
        run: |
          dotnet ef migrations add InitialV1_0_0 \
            --project services/player/src/Leds.Player.Infrastructure/Leds.Player.Infrastructure.csproj \
            --startup-project services/player/src/Leds.Player.Api/Leds.Player.Api.csproj \
            --context PlayerDbContext \
            --configuration Release \
            --output-dir Persistence/Migrations

      - name: Generate canonical V1 SQL creation script
        run: |
          mkdir -p services/player/database
          dotnet ef migrations script 0 InitialV1_0_0 \
            --project services/player/src/Leds.Player.Infrastructure/Leds.Player.Infrastructure.csproj \
            --startup-project services/player/src/Leds.Player.Api/Leds.Player.Api.csproj \
            --context PlayerDbContext \
            --configuration Release \
            --output services/player/database/player-db-v1.0.0.sql

      - name: Verify EF model is fully baselined
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project services/player/src/Leds.Player.Infrastructure/Leds.Player.Infrastructure.csproj \
            --startup-project services/player/src/Leds.Player.Api/Leds.Player.Api.csproj \
            --context PlayerDbContext \
            --configuration Release

      - name: Verify Player test suite
        run: dotnet test services/player/Leds.Player.slnx --configuration Release --no-build

      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/player/src/Leds.Player.Infrastructure/Persistence/Migrations services/player/database/player-db-v1.0.0.sql
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "db(player): squash migrations into V1 baseline"
          git push origin HEAD:feature/account-authentication
